# Nginx Proxy Manager — Advanced -> Custom Nginx Configuration for
# itglue-mcp.example.com  ->  10.0.0.10:8111
#
# Without these, NPM's 60s default read timeout cuts MCP streams and users see
# the connector drop mid-call. Every NEW proxy host starts back at the default,
# so this must be pasted per host.
#
# Also required in the NPM UI, not here:
#   * Details  -> Websockets Support: ON
#   * SSL      -> issue the Let's Encrypt cert FIRST, then attach the Access List
#   * Access List -> Anthropic egress allowlist (160.79.104.0/21 — verify the
#     current range at platform.claude.com/docs/en/api/ip-addresses)
#
# The document-index build is the only slow operation (~400 IT Glue calls on a
# cold start) and it runs in a background thread, so no request should ever be
# long-running. The generous timeouts are for MCP's streaming transport.

proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Preserve the original host/scheme so the server advertises correct URLs in its
# OAuth protected-resource metadata.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# /healthz is unauthenticated by design (container + LB probe). It reports index
# freshness and the safety posture, no customer data. If the Access List is
# attached, probe the raw host port instead: curl 10.0.0.10:8111/healthz
